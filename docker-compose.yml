name: gitinsight
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AUDIT_MAX_FILES: ${AUDIT_MAX_FILES:-8}
      AUDIT_FILE_BYTES: ${AUDIT_FILE_BYTES:-16000}
      AUDIT_TOTAL_BYTES: ${AUDIT_TOTAL_BYTES:-48000}
      AUDIT_GITHUB_CONCURRENCY: ${AUDIT_GITHUB_CONCURRENCY:-4}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      GITINSIGHT_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
